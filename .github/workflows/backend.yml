name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:publisher
      - run: pnpm --filter oh-kiosk-backend test
      - run: pnpm --filter oh-kiosk-frontend build
      - run: pnpm --filter oh-kiosk-frontend test:browser-preview
      - run: pnpm --filter oh-kiosk-frontend build:browser-preview
      - uses: actions/upload-artifact@v4
        with:
          name: oh-queue-frontend
          path: frontend/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: oh-queue-browser-preview
          path: frontend/dist-preview/
          if-no-files-found: error
